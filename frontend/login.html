<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Dietik App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-orange: #e29578ff;
            --primary-blue: #006d77ff;
        }

        body {
            background-color: #83c5beff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 400px;
            width: 100%;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .login-header h1 {
            color: var(--primary-blue);
            font-size: 2rem;
            margin-bottom: 10px;
            font-weight: bold;
        }
        
        .form-control {
            border-radius: 10px;
            border: 2px solid #e9ecef;
            padding: 12px 15px;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 0.2rem rgba(24, 143, 167, 0.25);
        }
        
        .btn-login {
            background-color: var(--primary-blue);
            border: none;
            border-radius: 25px;
            padding: 12px 30px;
            font-weight: 600;
            width: 100%;
            transition: all 0.3s ease;
        }

        .btn-login:hover {
            background-color: #006d77ff;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(24, 143, 167, 0.3);
        }
        
        .btn-register {
            background: transparent;
            border: 2px solid var(--primary-blue);
            color: var(--primary-blue);
            border-radius: 25px;
            padding: 12px 30px;
            font-weight: 600;
            width: 100%;
            transition: all 0.3s ease;
        }
        
        .btn-register:hover {
            background-color: var(--primary-blue);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(24, 143, 167, 0.3);
        }
        
        .alert {
            border-radius: 10px;
        }
        
        .toggle-form {
            text-align: center;
            margin-top: 20px;
        }
        
        .toggle-form a {
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .toggle-form a:hover {
            color: var(--primary-orange);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- Login Form -->
        <div id="loginForm">
            <div class="login-header">
                <h1>🍎 Dietik App</h1>
                <p class="text-muted">Inicia sesión para continuar</p>
            </div>
            
            <form id="loginFormElement">
                <div class="mb-3">
                    <label for="loginEmail" class="form-label">Email</label>
                    <input type="email" class="form-control" id="loginEmail" required>
                </div>
                <div class="mb-3">
                    <label for="loginPassword" class="form-label">Contraseña</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="loginPassword" required>
                        <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-login">
                    <i class="fas fa-sign-in-alt me-2"></i>Iniciar Sesión
                </button>
            </form>
            <!-- reactivar cuando se sepa como manejar el registro sin vulnerabilidades -->
            <!-- <div class="toggle-form">
                <a href="#" onclick="toggleForm()">¿No tienes cuenta? Regístrate</a>
            </div> -->
        </div>

        <!-- Register Form -->
        <div id="registerForm" style="display: none;">
            <div class="login-header">
                <h1>🍎 Dietik App</h1>
                <p class="text-muted">Crea tu cuenta</p>
            </div>
            
            <form id="registerFormElement">
                <div class="mb-3">
                    <label for="registerEmail" class="form-label">Email</label>
                    <input type="email" class="form-control" id="registerEmail" required>
                </div>
                <div class="mb-3">
                    <label for="registerPassword" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="registerPassword" required>
                </div>
                <div class="mb-3">
                    <label for="registerName" class="form-label">Nombre</label>
                    <input type="text" class="form-control" id="registerName">
                </div>
                <div class="mb-3">
                    <label for="registerTelegramId" class="form-label">ID Telegram</label>
                    <input type="text" class="form-control" id="registerTelegramId">
                </div>
                <button type="submit" class="btn btn-primary btn-login">
                    <i class="fas fa-user-plus me-2"></i>Registrarse
                </button>
            </form>
            
            <div class="toggle-form">
                <a href="#" onclick="toggleForm()">¿Ya tienes cuenta? Inicia sesión</a>
            </div>
        </div>

        <!-- Alert Messages -->
        <div id="alertContainer" class="mt-3"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let API_BASE_URL;
        let configLoaded = false;
        // Toggle password visibility
        document.addEventListener('DOMContentLoaded', function() {
            const togglePassword = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('loginPassword');

            togglePassword.addEventListener('mousedown', function(e) {
                passwordInput.type = 'text';
            });

            togglePassword.addEventListener('mouseup', function(e) {
                passwordInput.type = 'password';
            });

            togglePassword.addEventListener('mouseout', function(e) {
                passwordInput.type = 'password';
            });
        });

        // Función para construir URLs de la API
        function getApiUrl(endpoint) {
            if (!configLoaded) {
                throw new Error('La configuración no se ha cargada completamente');
            }
            
            if (!API_BASE_URL) {
                throw new Error('No se ha configurado la URL base de la API');
            }

            try {
                // Asegurarse de que el endpoint comienza con /
                if (!endpoint.startsWith('/')) {
                    endpoint = '/' + endpoint;
                }
                
                // Simplemente unir la base con el endpoint
                return `${API_BASE_URL}${endpoint}`;
            } catch (error) {
                console.error('Error al construir URL:', error);
                throw new Error('Error al construir la URL de la API');
            }
        }

        // Cargar configuración del backend
        async function loadConfig() {
            try {
                const response = await fetch('/api/config');
                if (!response.ok) {
                    throw new Error('No se pudo cargar la configuración');
                }
                
                const config = await response.json();
                if (!config.api_base_url) {
                    throw new Error('La configuración no incluye api_base_url');
                }

                // Si la URL es relativa, convertirla a absoluta
                if (!config.api_base_url.startsWith('http')) {
                    // Construir URL absoluta basada en la ubicación actual
                    const baseUrl = window.location.origin;
                    API_BASE_URL = new URL(config.api_base_url, baseUrl).origin;
                } else {
                    // Si es absoluta, usar directamente
                    API_BASE_URL = new URL(config.api_base_url).origin;
                }

                configLoaded = true;
                console.log('Configuración cargada correctamente');
            } catch (error) {
                console.error('Error al cargar la configuración:', error);
                showAlert('Error al cargar la configuración del sistema', 'danger');
                throw error;
            }
        }

        // Verificar si ya está autenticado
        document.addEventListener('DOMContentLoaded', async function() {
            try {
                // Cargar configuración primero
                await loadConfig();
                
                const authToken = localStorage.getItem('authToken');
                if (authToken) {
                    window.location.href = '/static/welcome.html';
                }
            } catch (error) {
                console.error('Error durante la inicialización:', error);
                // No redirigir si hay error, permitir que el usuario intente loguearse
            }
        });

        // Configurar formulario de login
        document.getElementById('loginFormElement').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const response = await fetch(getApiUrl('/auth/login'), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });

                if (response.ok) {
                    const result = await response.json();
                    localStorage.setItem('authToken', result.access_token);
                    showAlert('¡Login exitoso! Redirigiendo...', 'success');
                    setTimeout(() => {
                        window.location.href = '/static/welcome.html';
                    }, 1500);
                } else {
                    const error = await response.json();
                    showAlert(`Error: ${error.detail}`, 'danger');
                }
            } catch (error) {
                showAlert('Error de conexión', 'danger');
            }
        });

        // Configurar formulario de registro
        document.getElementById('registerFormElement').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const name = document.getElementById('registerName').value;
            const telegramId = document.getElementById('registerTelegramId').value;

            try {
                const response = await fetch(getApiUrl('/auth/register'), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password,
                        telegram_id: telegramId,
                        name: name
                    })
                });
                console.log('Response status:', response);
                if (response.ok) {
                    const result = await response.json();
                    showAlert('¡Registro exitoso! Verifica tu correo electrónico para poder iniciar sesion', 'success');
                    toggleForm(); // Cambiar a formulario de login
                } else {
                    const error = await response.json();
                    
                    showAlert(`Error: ${error.detail}`, 'danger');
                }
            } catch (error) {
                showAlert('Error de conexión', 'danger');
            }
        });

        // Alternar entre formularios
        function toggleForm() {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            
            if (loginForm.style.display === 'none') {
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
            } else {
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
            }
        }

        // Mostrar alertas
        function showAlert(message, type) {
            const alertContainer = document.getElementById('alertContainer');
            const alertId = 'alert-' + Date.now();
            
            alertContainer.innerHTML = `
                <div id="${alertId}" class="alert alert-${type} alert-dismissible fade show" role="alert">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;

            // Auto-dismiss after 5 seconds
            setTimeout(() => {
                const alert = document.getElementById(alertId);
                if (alert) {
                    alert.remove();
                }
            }, 5000);
        }
    </script>
</body>
</html>
