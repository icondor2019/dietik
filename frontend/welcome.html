<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Dietik App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-orange: #ff9505;
            --primary-blue: #188fa7;
        }
        
        .btn-primary {
            background-color: var(--primary-blue);
            border: none;
            border-radius: 25px;
            padding: 12px 30px;
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            background-color: #157d92;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(24, 143, 167, 0.3);
        }

        .btn-light {
            background-color: rgba(255, 255, 255, 0.9);
            border: none;
            color: #495057;
            transition: all 0.3s ease;
        }
        
        .btn-light:hover {
            background-color: #ffffff;
            color: var(--primary-blue);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
        }

        .welcome-message {
            text-align: center;
            margin-top: 100px;
            font-size: 3.5em;
            font-weight: bold;
            background: linear-gradient(135deg, var(--primary-orange) 0%, var(--primary-blue) 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientMove 8s ease infinite;
        }

        @keyframes gradientMove {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        .bg-dark {
            background-color: #1a1a1a !important;
        }

        .nav-link.active {
            background-color: var(--primary-orange) !important;
            box-shadow: 0 2px 10px rgba(255, 149, 5, 0.3);
        }

        .nav-link:hover:not(.active) {
            background-color: rgba(255, 149, 5, 0.1);
        }

        .badge.bg-primary {
            background-color: var(--primary-orange) !important;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-md-3 col-lg-2 d-md-block bg-dark sidebar collapse" style="min-height: 100vh;">
                <div class="position-sticky pt-3">
                    <div class="text-center mb-4">
                        <h4 class="text-white">🍎 Dietik App</h4>
                    </div>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link text-white" href="welcome.html">
                                <i class="fas fa-home me-2"></i>Inicio
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="daily_activity.html">
                                <i class="fas fa-dumbbell me-2"></i>Actividad Física
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="nutritional_plans.html">
                                <i class="fas fa-utensils me-2"></i>Planes Nutricionales
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="meal_records.html">
                                <i class="fas fa-list-alt me-2"></i>Control de Registros
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="#" onclick="logout()">
                                <i class="fas fa-sign-out-alt me-2"></i>Cerrar Sesión
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- Main content -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">Bienvenido</h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <div class="btn-group me-2">
                            <span class="badge bg-primary" id="userInfo">Usuario</span>
                        </div>
                    </div>
                </div>

                <!-- Welcome Message -->
                <div class="welcome-message">
                    Welcome
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let API_BASE_URL = 'http://localhost:8000/api';

        // Cargar configuración del backend
        async function loadConfig() {
            try {
                const response = await fetch('/api/config');
                if (response.ok) {
                    const config = await response.json();
                    API_BASE_URL = config.api_base_url;
                }
            } catch (error) {
                console.warn('No se pudo cargar la configuración del backend, usando configuración por defecto');
            }
        }

        // Función para cerrar sesión
        function logout() {
            localStorage.removeItem('authToken');
            window.location.href = 'login.html';
        }

        // Mostrar información del usuario
        document.addEventListener('DOMContentLoaded', async function() {
            // Cargar configuración primero
            await loadConfig();
            
            const authToken = localStorage.getItem('authToken');
            if (!authToken) {
                window.location.href = 'login.html';
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE_URL}/user/profile`, {
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                });
                
                if (response.ok) {
                    const userData = await response.json();
                    document.getElementById('userInfo').textContent = userData.user_id;
                } else {
                    logout();
                }
            } catch (error) {
                console.error('Error al obtener información del usuario:', error);
            }
        });
    </script>
</body>
</html>
